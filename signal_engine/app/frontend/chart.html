<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade chart</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg:#131722; --panel:#1e222d; --text:#d1d4dc; --muted:#787b86;
  --green:#26a69a; --red:#ef5350; --blue:#2962ff; --line:#2a2e39;
  --font:Inter,-apple-system,sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font); min-height:100vh;
}
.top{
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:12px; padding:12px 14px; border-bottom:1px solid var(--line);
}
.title{font-size:15px; font-weight:700; margin:0 0 4px;}
.sub{font-size:12px; color:var(--muted);}
.badge{
  font-size:11px; font-weight:700; padding:4px 8px; border-radius:6px;
  background:var(--panel); color:var(--muted); white-space:nowrap;
}
.badge.win{color:var(--green); background:rgba(38,166,154,.15);}
.badge.loss{color:var(--red); background:rgba(239,83,80,.15);}
.note{padding:0 14px 8px; font-size:11px; color:var(--muted);}
.wrap{position:relative; height:calc(100vh - 64px); width:100%;}
#chart{width:100%; height:100%;}
.pnl-card{
  position:absolute; top:12px; left:12px; z-index:5;
  padding:8px 12px; border-radius:8px; font-family:var(--font);
  text-align:left; pointer-events:none;
}
.pnl-card .amt{font-size:15px; font-weight:700; color:#fff;}
.pnl-card .meta{font-size:10px; color:rgba(255,255,255,.85); margin-top:2px;}
.err{padding:24px; color:var(--red);}
</style>
</head>
<body>
  <div class="top">
    <div>
      <h1 class="title" id="title">Loading…</h1>
      <div class="sub" id="sub"></div>
    </div>
    <span class="badge" id="resultBadge">—</span>
  </div>
  <div class="note" id="note"></div>
  <div class="wrap">
    <div id="chart"></div>
    <div class="pnl-card" id="pnlCard" style="display:none;"></div>
  </div>
<script>
const params = new URLSearchParams(location.search);
const tradeId = params.get('id') || params.get('trade_id');
const isBacktest = params.get('bt') === '1';

function fmtNum(n, dig=2){
  if (n == null || Number.isNaN(Number(n))) return '—';
  return Number(n).toFixed(dig);
}

function toChartTime(iso){
  // lightweight-charts wants unix seconds (UTC) - it renders the axis using
  // the browser's local zone by default, so we shift the value by the IST
  // offset and tell the chart to treat it as UTC. That way the axis always
  // reads true IST wall-clock time regardless of the viewer's own timezone.
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return null;
  const IST_OFFSET_MIN = 5.5 * 60;
  const localOffsetMin = -d.getTimezoneOffset();
  const shiftMin = IST_OFFSET_MIN - localOffsetMin;
  return Math.floor((d.getTime() + shiftMin * 60000) / 1000);
}

function fmtAxisIst(unixSeconds){
  const d = new Date(unixSeconds * 1000);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const hh = String(d.getUTCHours()).padStart(2,'0');
  const mm = String(d.getUTCMinutes()).padStart(2,'0');
  return `${d.getUTCDate()} ${months[d.getUTCMonth()]} ${hh}:${mm}`;
}

let chart, candleSeries, markerApi;

function buildChart(){
  const wrap = document.getElementById('chart');
  chart = LightweightCharts.createChart(wrap, {
    width: wrap.clientWidth,
    height: wrap.clientHeight,
    layout: { background: { color: '#131722' }, textColor: '#d1d4dc', fontFamily: 'Inter,-apple-system,sans-serif' },
    grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
    rightPriceScale: { borderColor: '#2a2e39' },
    timeScale: {
      borderColor: '#2a2e39',
      timeVisible: true,
      secondsVisible: false,
      tickMarkFormatter: fmtAxisIst,
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    localization: {
      timeFormatter: fmtAxisIst,
      priceFormatter: (p) => fmtNum(p),
    },
  });
  candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
    upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });
  window.addEventListener('resize', () => {
    chart.resize(wrap.clientWidth, wrap.clientHeight);
  });
}

async function load(){
  let url;
  if (isBacktest) {
    const qObj = {
      trade_index: params.get('idx') || '0',
      symbol: params.get('symbol') || 'NIFTY',
      mode: params.get('mode') || 'SCALP',
      step_minutes: params.get('step_minutes') || '15',
      mark_to_market: params.get('mark_to_market') || 'true',
      min_score: params.get('min_score') || '4',
    };
    // Prefer the explicit from_date/to_date range (current date-picker UI);
    // fall back to the legacy months param for any old bookmarked links.
    if (params.get('from_date') && params.get('to_date')) {
      qObj.from_date = params.get('from_date');
      qObj.to_date = params.get('to_date');
    } else {
      qObj.months = params.get('months') || '3';
    }
    const q = new URLSearchParams(qObj);
    url = `/api/report/performance/trade-chart?${q.toString()}`;
  } else if (tradeId) {
    url = `/api/journal/${tradeId}/chart`;
  } else {
    document.getElementById('title').textContent = 'Missing trade id';
    return;
  }
  const res = await fetch(url);
  const d = await res.json();
  if (!d.ok) {
    document.getElementById('title').textContent = d.error || 'Failed';
    return;
  }
  document.title = d.title + ' · chart';
  document.getElementById('title').textContent = d.title;
  const bits = [];
  if (d.entry?.time_label) bits.push('Entry ' + d.entry.time_label + ' IST');
  if (d.exit?.time_label) bits.push('Exit ' + d.exit.time_label + ' IST');
  bits.push(d.timezone || 'Asia/Kolkata');
  document.getElementById('sub').textContent = bits.join(' · ');
  const badge = document.getElementById('resultBadge');
  badge.textContent = d.result || '—';
  badge.className = 'badge ' + (d.result === 'WIN' ? 'win' : d.result === 'LOSS' ? 'loss' : '');
  if (d.note) document.getElementById('note').textContent = d.note + ` · candles: ${d.candle_source}`;
  else document.getElementById('note').textContent = `Candles: ${d.candle_source}`;
  draw(d);
}

function draw(d){
  const candles = (d.candles || [])
    .map(c => ({ time: toChartTime(c.time), open: c.open, high: c.high, low: c.low, close: c.close }))
    .filter(c => c.time != null)
    .sort((a, b) => a.time - b.time);

  if (!candles.length) {
    document.getElementById('chart').innerHTML = '<div class="err">No candle data</div>';
    return;
  }

  buildChart();
  candleSeries.setData(candles);

  const entry = d.entry?.price;
  const exitPx = d.exit?.price ?? d.target;
  const target = d.target;
  const stop = d.stop;
  const entryTime = toChartTime(d.entry?.time) ?? candles[0].time;
  const exitTime = toChartTime(d.exit?.time) ?? candles[candles.length - 1].time;

  // Price lines: entry / target / stop
  if (entry != null) {
    candleSeries.createPriceLine({
      price: entry, color: '#787b86', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: 'Entry',
    });
  }
  if (target != null) {
    candleSeries.createPriceLine({
      price: target, color: '#26a69a', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: 'Target',
    });
  }
  if (stop != null) {
    candleSeries.createPriceLine({
      price: stop, color: '#ef5350', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: 'Stop',
    });
  }

  // Entry -> exit trend line (actual line series, like drawing a trendline)
  if (exitPx != null && exitTime !== entryTime) {
    const trendSeries = chart.addSeries(LightweightCharts.LineSeries, {
      color: exitPx >= entry ? '#26a69a' : '#ef5350',
      lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed,
      pointMarkersVisible: false, lastValueVisible: false, priceLineVisible: false,
      crosshairMarkerVisible: false,
    });
    trendSeries.setData([{ time: entryTime, value: entry }, { time: exitTime, value: exitPx }]);
  }

  // Entry / exit markers on the candlestick series
  const markers = [];
  if (entry != null) {
    markers.push({ time: entryTime, position: 'belowBar', color: '#2962ff', shape: 'arrowUp', text: 'Entry ' + fmtNum(entry) });
  }
  if (exitPx != null) {
    const won = d.result === 'WIN' || (exitPx >= entry && d.result !== 'LOSS');
    markers.push({
      time: exitTime,
      position: exitPx >= entry ? 'aboveBar' : 'belowBar',
      color: won ? '#26a69a' : '#ef5350',
      shape: exitPx >= entry ? 'arrowDown' : 'arrowUp',
      text: 'Exit ' + fmtNum(exitPx),
    });
  }
  if (markers.length) {
    markers.sort((a, b) => a.time - b.time);
    LightweightCharts.createSeriesMarkers(candleSeries, markers);
  }

  chart.timeScale().fitContent();

  // Center P&L card
  const pnl = d.pnl_points;
  const card = document.getElementById('pnlCard');
  if (pnl != null) {
    card.style.display = 'block';
    card.style.background = pnl >= 0 ? '#1b5e20' : '#7f1d1d';
    const rr = d.rr != null ? `R:R ${d.rr}` : '';
    const pct = d.pnl_pct != null ? `${d.pnl_pct}%` : '';
    card.innerHTML = `<div class="amt">${pnl >= 0 ? '+' : ''}${fmtNum(pnl)}</div>` +
      `<div class="meta">${[pct, rr].filter(Boolean).join(' · ') || 'P&L'}</div>`;
  } else {
    card.style.display = 'none';
  }
}

load();
</script>
</body>
</html>
