# Reverse proxy: public port 80 -> gunicorn on 127.0.0.1:8000.
# Installed by setup_oci.sh to /etc/nginx/sites-available/kite-scanner.
#
# This dashboard has no login/auth of its own - it was built to run on
# localhost. Once it's reachable at a public IP, treat the OCI Security
# List / NSG as your actual access control: restrict inbound :80/:443 to
# your own IP (or a small allowlist) rather than 0.0.0.0/0, since anyone
# who can reach this port can see your scan results, trade tracker, and
# backtest data. If you want it open to more than a handful of trusted
# IPs, add HTTP basic auth here first (see the commented block below).
server {
    listen 80;
    server_name _;

    # Uncomment once you've run: sudo apt-get install -y apache2-utils
    #                            sudo htpasswd -c /etc/nginx/.htpasswd <username>
    # auth_basic "Kite Scanner";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
